<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Form</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>APPLICATION FORM</h1>

        <div class="section-title">Personal Detail</div>

        <div class="form-row">

            <div class="form-group">
                <label>Applicant's Full Name</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Care Of</label>
                <select>
                    <option>-- Select --</option>
                    <option>Parents</option>
                    <option>Guardian</option>
                </select>
            </div>

            <div class="form-group">
                <label>Father's Name</label>
                <input type="text">
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Mother's Name</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Gender</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender">
                        Others
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date">
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Marital Status</label>

                <select>
                    <option>-- Select --</option>
                    <option>Single</option>
                    <option>Married</option>
                    <option>Divorced</option>
                    <option>Widowed</option>
                </select>
            </div>

            <div class="form-group">
                <label>Category</label>

                <select>
                    <option>-- Select --</option>
                    <option>General</option>
                    <option>OBC</option>
                    <option>SC</option>
                    <option>ST</option>
                </select>
            </div>

            <div class="form-group">
                <label>Religion</label>

                <select>
                    <option>-- Select --</option>
                    <option>Hindu</option>
                    <option>Muslim</option>
                    <option>Christian</option>
                    <option>Sikh</option>
                    <option>Other</option>
                </select>
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Handicapped</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="handicapped">
                        No
                    </label>

                    <label>
                        <input type="radio" name="handicapped">
                        Yes
                    </label>
                </div>
            </div>


            <div class="form-group">
                <label>Ex-Serviceman</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="exservice">
                        No
                    </label>

                    <label>
                        <input type="radio" name="exservice">
                        Yes
                    </label>
                </div>
            </div>


            <div class="form-group">
                <label>EWS</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="ews">
                        No
                    </label>

                    <label>
                        <input type="radio" name="ews">
                        Yes
                    </label>
                </div>
            </div>

        </div>


        <div class="section-title">Contact Details</div>

        <div class="form-row">

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel">
            </div>

            <div class="form-group">
                <label>Email ID</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>Address Line 1</label>
                <input type="text">
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Address Line 2</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>City</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>State</label>

                <select>
                    <option>-- Select --</option>
                    <option>Madhya Pradesh</option>
                    <option>Maharashtra</option>
                    <option>Rajasthan</option>
                    <option>Uttar Pradesh</option>
                    <option>Delhi</option>
                </select>
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Pin Code</label>
                <input type="text">
            </div>

        </div>



        <div class="section-title">Qualification Details</div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Sr No.</th>
                        <th>Qualification</th>
                        <th>Board/University</th>
                        <th>Passing Year</th>
                        <th>Max Marks</th>
                        <th>Marks Obtain</th>
                        <th>Percentage</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>1</td>
                        <td>
                            <select>
                                <option>-- Select --</option>
                                <option>10th</option>
                                <option>12th</option>
                                <option>Graduation</option>
                            </select>
                        </td>
                        <td><input type="text"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>
                            <select>
                                <option>-- Select --</option>
                                <option>10th</option>
                                <option>12th</option>
                                <option>Graduation</option>
                            </select>
                        </td>
                        <td><input type="text"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>3</td>
                        <td>
                            <select>
                                <option>-- Select --</option>
                                <option>10th</option>
                                <option>12th</option>
                                <option>Graduation</option>
                            </select>
                        </td>
                        <td><input type="text"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>4</td>
                        <td>
                            <select>
                                <option>-- Select --</option>
                                <option>10th</option>
                                <option>12th</option>
                                <option>Graduation</option>
                            </select>
                        </td>
                        <td><input type="text"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                        <td><input type="text"></td>
                    </tr>

                </tbody>

            </table>

        </div>



        <div class="section-title">Language Knowledge</div>

        <table class="language-table">

            <thead>
                <tr>
                    <th>Language</th>
                    <th>Reading</th>
                    <th>Writing</th>
                    <th>Spoken</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Hindi</td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                </tr>

                <tr>
                    <td>English</td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                </tr>

                <tr>
                    <td>Urdu</td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                </tr>

            </tbody>

        </table>



        <div class="section-title">Identification Details</div>

        <div class="form-row">

            <div class="form-group">
                <label>Aadhaar Card Number</label>
                <input type="text" maxlength="12">
            </div>

            <div class="form-group">
                <label>PAN Card Number</label>
                <input type="text" maxlength="10">
            </div>

        </div>



        <div class="section-title">Upload Documents</div>

        <div class="form-row">

            <div class="form-group">
                <label>Upload Photo</label>
                <input type="file" accept="image/*">
            </div>

            <div class="form-group">
                <label>Upload Signature</label>
                <input type="file" accept="image/*">
            </div>

        </div>



        <div class="buttons">

            <button class="submit-btn" type="submit">
                Submit
            </button>

            <button class="back-btn" type="button" onclick="history.back()">
                Back
            </button>

        </div>

    </div>

</body>
</html>
