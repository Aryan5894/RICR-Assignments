<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registration Forms</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- LOGIN CARD -->
    <div class="form-card">
      <h2 class="title">Login</h2>

      <div class="input-box">
        <i class="fa-regular fa-envelope icon"></i>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock icon"></i>
        <input type="password" placeholder="Confirm a password" required>
        <i class="fa-regular fa-eye eye-icon"></i>
      </div>

      <div class="options">
        <label class="checkbox-label">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="link">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Login Now</button>

      <div class="footer-text">
        Don't have an account? <a href="#" class="link">Signup now</a>
      </div>
    </div>

    <!-- REGISTRATION CARD -->
    <div class="form-card">
      <h2 class="title">Registration</h2>

      <div class="input-box">
        <i class="fa-regular fa-user icon"></i>
        <input type="text" placeholder="Enter your name" required>
      </div>

      <div class="input-box">
        <i class="fa-regular fa-envelope icon"></i>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock icon"></i>
        <input type="password" placeholder="Create a password" required>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock icon"></i>
        <input type="password" placeholder="Confirm a password" required>
        <i class="fa-regular fa-eye eye-icon"></i>
      </div>

      <div class="options">
        <label class="checkbox-label">
          <input type="checkbox"> I accept all terms & conditions
        </label>
      </div>

      <button type="submit" class="btn">Register Now</button>

      <div class="footer-text">
        Already have an account? <a href="#" class="link">Login now</a>
      </div>
    </div>

  </div>

</body>
</html>
